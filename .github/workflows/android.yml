name: Android CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android application
    runs-on: ubuntu-latest
    outputs:
      signed_release: ${{ steps.signing.outputs.ready }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Set up Android CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          source "$HOME/.bashrc" 2>/dev/null || true
          ANDROID_CLI="$(command -v android || find "$HOME" -type f -name android -perm -u+x -print -quit)"
          test -n "$ANDROID_CLI"
          echo "$(dirname "$ANDROID_CLI")" >> "$GITHUB_PATH"
          "$ANDROID_CLI" --version

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          android --sdk="$SDK_ROOT" sdk install \
            platform-tools \
            platforms/android-35 \
            build-tools/35.0.0 \
            ndk/27.2.12479018 \
            cmake/3.22.1

      - name: Check out Mysh source
        uses: actions/checkout@v7
        with:
          repository: Waizusora/Mysh
          ref: 72eb046782a1992d03f5ff9585402aca87ad457b
          path: .build/Mysh

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Run Mysh host tests
        run: cargo test --manifest-path .build/Mysh/Cargo.toml --locked --all-targets

      - name: Build and package Mysh for Android ABIs
        shell: bash
        run: |
          set -euo pipefail
          NDK_TOOLCHAIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          NATIVE_LIB_ROOT="app/src/main/jniLibs"
          mkdir -p "$NATIVE_LIB_ROOT/arm64-v8a" "$NATIVE_LIB_ROOT/x86_64"

          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_TOOLCHAIN/aarch64-linux-android21-clang" \
            cargo build --manifest-path .build/Mysh/Cargo.toml --locked --release --target aarch64-linux-android
          install -m 755 .build/Mysh/target/aarch64-linux-android/release/mysh "$NATIVE_LIB_ROOT/arm64-v8a/libmysh.so"

          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_TOOLCHAIN/x86_64-linux-android21-clang" \
            cargo build --manifest-path .build/Mysh/Cargo.toml --locked --release --target x86_64-linux-android
          install -m 755 .build/Mysh/target/x86_64-linux-android/release/mysh "$NATIVE_LIB_ROOT/x86_64/libmysh.so"

      - name: Verify packaged Mysh ELF architectures
        shell: bash
        run: |
          set -euo pipefail
          readelf -h app/src/main/jniLibs/arm64-v8a/libmysh.so | grep -F "Machine:" | grep -F "AArch64"
          readelf -h app/src/main/jniLibs/x86_64/libmysh.so | grep -F "Machine:" | grep -F "Advanced Micro Devices X86-64"
          test -x app/src/main/jniLibs/arm64-v8a/libmysh.so
          test -x app/src/main/jniLibs/x86_64/libmysh.so

      - name: Detect release signing configuration
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All release-signing secrets are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Optional release signing is not configured. Signed release packaging will be skipped."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --warning-mode=all

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: terminal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      - name: Decode Android signing keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/terminal-release.jks"
          chmod 600 "$RUNNER_TEMP/terminal-release.jks"

      - name: Build signed release APK
        id: release
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/terminal-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace --warning-mode=all
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload signed release APK
        if: steps.release.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: terminal-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish signed APK to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.signed_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v8
        with:
          name: terminal-release-apk
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/app-release.apk
          fail_on_unmatched_files: true
